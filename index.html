<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Google</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .topbar {
      height: 60px;
      padding: 6px 30px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      font-size: 13px;
    }

    .apps-link {
      width: 40px;
      height: 40px;
      margin-left: -9px;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }

    .apps-link:hover {
      background: #f0f0f0;
      text-decoration: none;
    }

    .apps-grid {
      width: 18px;
      height: 18px;
      display: grid;
      grid-template-columns: repeat(3, 4px);
      grid-template-rows: repeat(3, 4px);
      gap: 3px;
    }

    .apps-grid span {
      border-radius: 50%;
      background: #5f6368;
    }

    .sign-in {
      min-width: 96px;
      height: 36px;
      padding: 0 23px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: #1a73e8;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.25px;
    }

    .sign-in:hover {
      background: #1b66c9;
      box-shadow: 0 1px 2px rgba(66, 133, 244, 0.3);
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 128px 20px 30px;
    }

    .logo {
      margin: 0 0 27px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(82px, 12vw, 92px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -7px;
      user-select: none;
    }

    .blue { color: #4285f4; }
    .red { color: #ea4335; }
    .yellow { color: #fbbc05; }
    .green { color: #34a853; }

    .search-form {
      width: min(100%, 584px);
    }

    .search-box {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }

    .search-box:hover,
    .search-box:focus-within {
      border-color: transparent;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    }

    .search-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      color: #9aa0a6;
    }

    .search-input {
      min-width: 0;
      height: 100%;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202124;
      font: 16px Arial, Helvetica, sans-serif;
    }

    .search-tools {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tool-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .actions {
      margin-top: 29px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .actions button {
      min-height: 36px;
      padding: 0 16px;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      background: #f8f9fa;
      color: #3c4043;
      font: 14px Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    .actions button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    }

    .language {
      margin-top: 28px;
      color: #4d5156;
      font-size: 13px;
      text-align: center;
    }

    .language a {
      margin-left: 7px;
      color: #1a0dab;
    }

    footer {
      background: #f2f2f2;
      color: #1f1f1f;
      font-size: 14px;
    }

    .country {
      min-height: 48px;
      padding: 15px 30px;
      border-bottom: 1px solid #dadce0;
      color: #1f1f1f;
    }

    .footer-links {
      min-height: 46px;
      padding: 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .footer-group {
      display: flex;
      align-items: center;
      gap: 27px;
    }

    @media (max-width: 650px) {
      main {
        padding-top: clamp(90px, 18vh, 128px);
      }

      .topbar {
        padding-right: 18px;
        gap: 14px;
      }

      .footer-links {
        justify-content: center;
        flex-wrap: wrap;
        padding: 12px 20px;
      }

      .footer-group {
        justify-content: center;
        flex-wrap: wrap;
        gap: 16px 24px;
      }
    }

    @media (max-height: 700px) and (min-width: 651px) {
      main {
        padding-top: 70px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="#">Gmail</a>
    <a href="#">Images</a>
    <a class="apps-link" href="#" aria-label="Google apps">
      <span class="apps-grid" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </span>
    </a>
    <a class="sign-in" href="#">Sign in</a>
  </header>

  <main>
    <h1 class="logo" aria-label="Google">
      <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
    </h1>

    <form class="search-form" role="search">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.78L20 21.49 21.49 20l-5.99-6zm-5 0A4.5 4.5 0 1 1 10.5 5a4.5 4.5 0 0 1 0 9z"/>
        </svg>
        <input class="search-input" type="search" aria-label="Search">
        <span class="search-tools" aria-hidden="true">
          <svg class="tool-icon" viewBox="0 0 24 24">
            <path fill="#4285f4" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
            <path fill="#34a853" d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11z"/>
            <path fill="#ea4335" d="M12 3a2 2 0 0 0-2 2v2h4V5a2 2 0 0 0-2-2z"/>
            <path fill="#fbbc05" d="M7 11h2a3 3 0 0 0 6 0h2a5 5 0 0 1-10 0z"/>
          </svg>
          <svg class="tool-icon" viewBox="0 0 24 24">
            <path fill="#4285f4" d="M12 4.2a7.8 7.8 0 0 0-5.52 13.28l1.42-1.42A5.8 5.8 0 1 1 12 17.8v2a7.8 7.8 0 0 0 0-15.6z"/>
            <path fill="#34a853" d="M4.2 12a7.8 7.8 0 0 0 2.28 5.52l1.42-1.42A5.8 5.8 0 0 1 12 6.2v-2A7.8 7.8 0 0 0 4.2 12z"/>
            <path fill="#ea4335" d="M12 4.2v2a5.8 5.8 0 0 1 4.1 9.9l1.42 1.42A7.8 7.8 0 0 0 12 4.2z"/>
            <path fill="#fbbc05" d="M12 17.8v2a7.8 7.8 0 0 0 5.52-2.28l-1.42-1.42A5.78 5.78 0 0 1 12 17.8z"/>
            <circle cx="12" cy="12" r="2.5" fill="#4285f4"/>
          </svg>
        </span>
      </div>
      <div class="actions">
        <button type="button">Google Search</button>
        <button type="button">I’m Feeling Lucky</button>
      </div>
    </form>

    <p class="language">Google offered in:
      <a href="#">हिन्दी</a><a href="#">বাংলা</a><a href="#">తెలుగు</a><a href="#">मराठी</a>
    </p>
  </main>

  <footer>
    <div class="country">India</div>
    <nav class="footer-links" aria-label="Footer">
      <div class="footer-group">
        <a href="#">About</a>
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search works</a>
      </div>
      <div class="footer-group">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </nav>
  </footer>
</body>
</html>
